name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Tag '$tag' does not produce a valid SemVer string. Expected format: v1.2.3"
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version: $version"

      - name: Get cache week
        id: week
        run: echo "week=$(date +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Cache PowerShell modules
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.local/share/powershell/Modules
          key: ps-release-${{ steps.week.outputs.week }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ps-release-

      - name: Install build dependencies
        shell: pwsh
        run: |
          foreach ($mod in @(
              @{ Name = 'InvokeBuild' },
              @{ Name = 'Pester'; MinimumVersion = '5.0.0' },
              @{ Name = 'PSScriptAnalyzer' }
          )) {
              if (-not (Get-Module -ListAvailable -Name $mod.Name)) {
                  $installParams = @{
                      Name  = $mod.Name
                      Force = $true
                      Scope = 'CurrentUser'
                  }
                  if ($mod.MinimumVersion) { $installParams.MinimumVersion = $mod.MinimumVersion }
                  Install-Module @installParams
              }
          }
          if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PlatyPS)) {
              Install-PSResource -Name Microsoft.PowerShell.PlatyPS -Scope CurrentUser -TrustRepository
          }

      - name: Login to Azure (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Run release pipeline
        shell: pwsh
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        # Wrap via scripts/Invoke-WithDJMHostExit.ps1 — see ADR-030. Invoke-Build
        # Release imports DJMLog (the Test task does); the helper forces
        # [System.Environment]::Exit so the v2.0 async writer cannot block
        # pwsh.exe shutdown.
        run: |
          & ./scripts/Invoke-WithDJMHostExit.ps1 -Script {
              $buildParams = @{
                  Task          = 'Release'
                  Configuration = 'Release'
                  Version       = '${{ steps.version.outputs.version }}'
              }
              Invoke-Build @buildParams
          }

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.repos.createRelease({
              owner:                  context.repo.owner,
              repo:                   context.repo.repo,
              tag_name:               context.ref.replace('refs/tags/', ''),
              name:                   context.ref.replace('refs/tags/', ''),
              generate_release_notes: true,
              draft:                  false,
              prerelease:             false
            });
