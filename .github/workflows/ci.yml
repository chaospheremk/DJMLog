name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    if: github.actor != 'claude[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      powershell: ${{ steps.filter.outputs.powershell }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            powershell:
              - 'Public/**'
              - 'Private/**'
              - 'tests/**'
              - 'DJMLog.psd1'
              - 'DJMLog.psm1'
              - 'PSScriptAnalyzerSettings.psd1'
              - '.github/workflows/ci.yml'

  lint:
    name: PSScriptAnalyzer
    needs: changes
    if: github.actor != 'claude[bot]' && github.actor != 'dependabot[bot]' && needs.changes.outputs.powershell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache PowerShell modules
        uses: actions/cache@v5
        with:
          path: ~/.local/share/powershell/Modules
          key: ps-lint-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ps-lint-

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
              throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer: no issues found.' -ForegroundColor Green

  test:
    name: Pester Tests
    needs: changes
    if: github.actor != 'claude[bot]' && github.actor != 'dependabot[bot]' && needs.changes.outputs.powershell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6

      - name: Cache PowerShell modules
        uses: actions/cache@v5
        with:
          path: ~/.local/share/powershell/Modules
          key: ps-test-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ps-test-

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
              Install-Module -Name Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0
          }

      - name: Run Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = './TestResults.xml'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = './CoverageResults.xml'
          $config.CodeCoverage.Path = @('./Public', './Private')
          Invoke-Pester -Configuration $config

      - name: Check code coverage threshold
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content './CoverageResults.xml' -Raw
          $counter = $coverage.report.counter | Where-Object { $_.type -eq 'LINE' }
          $covered = [int]$counter.covered
          $missed = [int]$counter.missed
          $total = $covered + $missed
          if ($total -eq 0) {
              Write-Host 'No coverage data — skipping threshold check.'
              exit 0
          }
          $percent = [math]::Round(($covered / $total) * 100, 1)
          Write-Host "Code coverage: $percent% ($covered/$total lines)"
          if ($percent -lt 50) {
              throw "Code coverage $percent% is below the 50% minimum threshold."
          }

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Pester Tests
          path: TestResults.xml
          reporter: java-junit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xml

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: CoverageResults.xml

  secret-scan:
    name: Secret Scan
    if: github.actor != 'claude[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  ci-gate:
    name: CI Gate
    if: always() && github.actor != 'claude[bot]' && github.actor != 'dependabot[bot]'
    needs: [lint, test, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
